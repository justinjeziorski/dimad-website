<div id="view-dimad-notepad" class="tab-view hidden p-4 border border-brand-border bg-brand-panel rounded space-y-3">
  <div class="flex items-center justify-between gap-3">
    <div>
      <h2 class="text-sm font-bold text-brand-gold">DIMAD NOTEPAD</h2>
      <p class="text-[11px] text-slate-400 mt-0.5">Scratchpad for meetings, ops notes, and execution drafts. Saved locally on this device.</p>
    </div>
    <button type="button" onclick="DIMAD_NOTEPAD.create()" class="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-[11px] font-semibold text-slate-200 px-3 py-1.5 rounded-xl transition">
      + New Note
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-3 min-h-[420px]">
    <div class="lg:col-span-1 border border-slate-800 rounded-xl bg-slate-950/50 overflow-hidden flex flex-col">
      <div class="px-3 py-2 border-b border-slate-800 text-[10px] font-mono text-slate-500 uppercase tracking-wide">Notes</div>
      <div id="notepad-list" class="flex-1 overflow-y-auto p-1.5 space-y-1"></div>
    </div>
    <div class="lg:col-span-2 border border-slate-800 rounded-xl bg-slate-950/50 p-3 flex flex-col space-y-2">
      <textarea id="notepad-body" placeholder="draft notes here..." oninput="DIMAD_NOTEPAD.markDirty()" class="flex-1 min-h-[280px] bg-transparent outline-none text-[13px] leading-relaxed text-slate-300 resize-none font-mono placeholder:text-slate-600"></textarea>
      <div class="flex items-center justify-between gap-3 text-[10px] text-slate-500 pt-1 border-t border-slate-800">
        <span id="notepad-meta">No note selected</span>
        <button type="button" id="notepad-quick-save" onclick="DIMAD_NOTEPAD.save()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-[11px] px-3 py-1.5 rounded-xl transition shadow-lg shadow-amber-500/10">Quick Save</button>
      </div>
    </div>
  </div>
</div>
