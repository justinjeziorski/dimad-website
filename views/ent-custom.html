<!-- TAB: CUSTOM WORKSPACE -->
<div id="view-ent-custom" class="tab-view hidden space-y-3 w-full h-[83vh] flex flex-col">
  <div class="border border-brand-border bg-brand-panel p-3 rounded flex items-center justify-between flex-shrink-0">
    <div class="flex items-center space-x-3">
      <span class="font-bold text-brand-gold text-xs flex items-center gap-1.5"><i class="fa-solid fa-window-maximize"></i> CUSTOM WORKSPACE COCKPIT</span>
      <button onclick="toggleHowToModal()" class="bg-brand-gold/10 hover:bg-brand-gold/20 text-brand-gold border border-brand-gold/40 px-2 py-0.5 rounded text-[9px] font-bold flex items-center gap-1 transition-all">
        <i class="fa-solid fa-circle-question"></i> How to Add Workspace (?)
      </button>
    </div>
    <div class="flex items-center space-x-2">
      <input id="new-workspace-name" type="text" placeholder="Workspace Name..." class="bg-brand-black border border-brand-border px-2 py-1 rounded text-[10px] text-slate-200 w-36">
      <input id="new-workspace-url" type="text" placeholder="Paste HTTPS URL..." class="bg-brand-black border border-brand-border px-2 py-1 rounded text-[10px] text-slate-200 w-44">
      <button onclick="addCustomWorkspace()" class="bg-brand-gold/20 hover:bg-brand-gold/30 border border-brand-gold text-brand-gold px-3 py-1 rounded font-bold text-[10px]">+ PIN</button>
    </div>
  </div>

  <div class="border border-brand-border/60 bg-brand-panel/60 p-2 rounded flex flex-col space-y-1.5 flex-shrink-0">
    <div class="flex items-center justify-between">
      <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider flex items-center gap-1">
        <i class="fa-solid fa-lightbulb text-brand-gold"></i> TOP 5 <span id="suggestion-mode-label" class="text-brand-gold">NOMAD</span> PRESETS:
      </span>
    </div>
    <div id="suggestions-container" class="flex items-center space-x-2 overflow-x-auto pb-1"></div>
  </div>

  <div id="workspace-tabs-bar" class="flex space-x-2 overflow-x-auto pb-1 flex-shrink-0"></div>
  <div id="full-embed-canvas" class="flex-1 bg-brand-black border border-brand-border rounded overflow-hidden flex flex-col items-center justify-center relative"></div>
</div>
