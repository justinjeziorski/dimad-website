        <select id="cc-pipeline-status" onchange="PIPELINE.renderDash()" class="text-[9px] font-mono bg-white/[0.03] text-slate-300 border border-white/10 px-2 py-0.5 rounded-full outline-none cursor-pointer hover:text-brand-gold hover:border-gold-soft max-w-[7.5rem]">
          <option value="all">All open</option>
          <option value="Target">Target</option>
          <option value="Pitched">Pitched</option>
          <option value="Negotiating">Negotiating</option>
          <option value="Active Collab">Active Collab</option>
          <option value="Paid">Paid</option>
          <option value="Closed">Closed</option>
        </select>
      </h3>
      <div data-cc-body class="cc-bento-body space-y-1.5 text-[10px]">
        <div id="cc-pipeline-list" class="space-y-1.5"></div>
      </div>
    </div>

    <div data-cc-module="billing" class="cc-bento-card p-3 space-y-2 min-w-0 flex flex-col">
      <h3 class="border-b border-white/10 pb-1.5 flex items-center justify-between gap-2 shrink-0">
        <button type="button" onclick="switchTab('ent-invoices')" class="inline-flex items-center gap-1.5 text-[10px] font-semibold text-slate-100 tracking-wide hover:text-brand-gold transition">
          <i class="fa-solid fa-file-invoice-dollar text-brand-gold text-[9px]"></i> Billing
        </button>
        <div class="flex items-center gap-1 min-w-0">
          <label class="sr-only" for="cc-billing-kind">Billing type</label>
          <select id="cc-billing-kind" onchange="INVOICES.onDashKindChange()" class="text-[9px] font-mono bg-white/[0.03] text-slate-300 border border-white/10 px-2 py-0.5 rounded-full outline-none cursor-pointer hover:text-brand-gold hover:border-gold-soft max-w-[6.5rem]">
            <option value="invoices" selected>Invoices</option>
            <option value="proposals">Proposals</option>
          </select>
          <label class="sr-only" for="cc-billing-status">Billing status</label>
          <select id="cc-billing-status" onchange="INVOICES.renderDash()" class="text-[9px] font-mono bg-white/[0.03] text-slate-300 border border-white/10 px-2 py-0.5 rounded-full outline-none cursor-pointer hover:text-brand-gold hover:border-gold-soft max-w-[5.5rem]">
            <option value="all" selected>All</option>
            <option value="Draft">Draft</option>
            <option value="Sent">Sent</option>
            <option value="Paid">Paid</option>
            <option value="Overdue">Overdue</option>
          </select>
        </div>
      </h3>
      <div data-cc-body class="cc-bento-body space-y-1.5 text-[10px]">
        <div id="cc-billing-list" class="space-y-1.5"></div>
      </div>
    </div>

    <div data-cc-module="notepad" class="cc-bento-card p-3 space-y-2 min-w-0 flex flex-col">
      <h3 class="border-b border-white/10 pb-1.5 flex items-center justify-between gap-2 shrink-0">
        <span class="flex items-center gap-1.5 min-w-0">
          <button type="button" onclick="switchTab('dimad-notepad')" class="inline-flex items-center gap-1.5 shrink-0 text-[10px] font-semibold text-slate-100 tracking-wide hover:text-brand-gold transition">
            <i class="fa-solid fa-note-sticky text-brand-gold text-[9px]"></i> dimPad
          </button>
          <span class="relative">
            <button type="button" onclick="DIMAD_NOTEPAD.toggleHelp(event, 'cc')" aria-label="About dimPad" class="w-4 h-4 rounded-full border border-white/10 text-[9px] leading-none text-slate-400 hover:text-brand-gold hover:border-gold-soft">?</button>
            <div id="cc-notepad-help" class="hidden absolute left-0 top-full mt-1 z-30 w-56 rounded-lg cc-bento-card shadow-xl p-2.5 text-[10px] font-normal leading-relaxed text-slate-300">Cloud-based notepad. Autosaves directly to dimDrive. Think it. Jot it. Save it.</div>
          </span>
        </span>
        <span class="flex flex-wrap items-center justify-end gap-1.5 shrink-0">
          <span class="relative">
            <button type="button" onclick="DIMAD_NOTEPAD.toggleRecent(event)" class="text-[9px] font-semibold text-slate-300 hover:text-brand-gold border border-white/10 bg-transparent px-2 py-0.5 rounded-full transition">Recent</button>
            <div id="cc-notepad-recent" class="hidden absolute right-0 top-full mt-1 z-30 w-48 max-h-56 overflow-y-auto rounded-lg cc-bento-card shadow-xl py-0.5"></div>
          </span>
          <button type="button" onclick="DIMAD_NOTEPAD.createFromDash()" class="text-[9px] font-semibold text-brand-gold hover:text-amber-300 border border-gold-soft bg-brand-gold/10 px-2 py-0.5 rounded-full transition">+ New Note</button>
        </span>
      </h3>
      <div data-cc-body class="cc-bento-body flex flex-col gap-2 min-h-0">
        <div class="shrink-0">
          <button type="button" id="cc-notepad-title" ondblclick="DIMAD_NOTEPAD.beginTitleEdit(event, 'dash')" title="Double-click to rename" class="w-full text-left text-[11px] font-semibold text-slate-100 truncate px-0.5 hover:text-brand-gold cursor-text">Untitled</button>
          <input id="cc-notepad-title-input" type="text" class="hidden w-full surface-nested border border-gold-soft rounded-md px-2 py-1 text-[11px] font-semibold text-slate-100 outline-none" onkeydown="DIMAD_NOTEPAD.titleKey(event)" onblur="DIMAD_NOTEPAD.commitTitleEdit()" onclick="event.stopPropagation()">
          <p id="cc-notepad-stamp" class="text-[8px] text-slate-500 px-0.5 mt-0.5">Created —</p>
        </div>
        <textarea id="cc-notepad-body" rows="5" placeholder="Save your thoughts here..." oninput="DIMAD_NOTEPAD.markDirty('dash')" class="cc-bento-textarea w-full flex-1 min-h-[5rem] surface-nested p-2.5 rounded-lg text-[11px] leading-relaxed text-slate-200 placeholder:text-slate-600 outline-none focus:border-gold-soft resize-none font-sans border border-white/10"></textarea>
        <div class="flex items-center justify-between gap-2 shrink-0">
          <p id="cc-notepad-status" class="text-[9px] text-slate-500">Autosaves to dimPad.</p>
          <button type="button" id="cc-notepad-save" onclick="DIMAD_NOTEPAD.saveDash()" class="text-[9px] font-semibold text-slate-300 hover:text-brand-gold border border-white/10 bg-transparent px-2 py-0.5 rounded-full transition">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>
