<div id="view-ent-stocks" class="tab-view hidden p-4 border border-brand-border bg-brand-panel rounded space-y-3">
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-2">
    <div>
      <h2 class="text-sm font-bold text-amber-400">STOCKS & FINANCE</h2>
      <p class="text-[11px] text-slate-400 mt-0.5">Finnhub live quotes, symbol search, and market news.</p>
    </div>
    <div class="flex items-center flex-wrap gap-2">
      <span id="finnhub-status" class="text-[9px] font-mono text-slate-500">Offline · paste a free Finnhub token for live data</span>
      <input id="finnhub-token" type="password" autocomplete="off" placeholder="Finnhub API token" onchange="FINNHUB_MARKETS.saveToken(this.value)" class="bg-brand-black border border-brand-border rounded px-2 py-1 text-[10px] text-slate-200 w-44">
      <a href="https://finnhub.io/register" target="_blank" rel="noopener noreferrer" class="text-[9px] text-brand-gold underline underline-offset-2">Get free key</a>
    </div>
  </div>

  <div class="relative">
    <div class="flex items-center bg-brand-black border border-brand-border rounded px-2.5">
      <i class="fa-solid fa-magnifying-glass text-slate-500 text-[10px]"></i>
      <input id="finnhub-search" type="text" placeholder="Search stocks (AAPL, Tesla, NVDA…)" oninput="FINNHUB_MARKETS.search(this.value)" class="flex-1 bg-transparent outline-none px-2 py-2 text-[12px] text-slate-100">
    </div>
    <div id="finnhub-search-results" class="hidden absolute z-20 left-0 right-0 mt-1 bg-slate-950 border border-slate-800 rounded-lg overflow-hidden max-h-56 overflow-y-auto"></div>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-12 gap-3">
    <div class="xl:col-span-3 border border-slate-800 rounded-xl bg-slate-950/50 overflow-hidden flex flex-col min-h-[360px]">
      <div class="px-3 py-2 border-b border-slate-800 flex items-center justify-between">
        <span class="text-[10px] font-mono text-slate-500 uppercase tracking-wide">Watchlist</span>
        <span class="text-[9px] text-slate-600">Finnhub</span>
      </div>
      <div id="finnhub-watchlist" class="flex-1 overflow-y-auto divide-y divide-slate-800/80"></div>
    </div>

    <div class="xl:col-span-5 border border-slate-800 rounded-xl bg-slate-950/50 p-3 space-y-3 min-h-[360px]">
      <div class="flex items-start justify-between gap-2">
        <div>
          <div class="text-[10px] font-mono text-slate-500" id="finnhub-quote-name">—</div>
          <h3 class="text-lg font-bold text-white tracking-wide" id="finnhub-quote-symbol">AAPL</h3>
        </div>
        <div class="text-right">
          <div class="text-xl font-bold text-slate-100 font-mono" id="finnhub-quote-price">—</div>
          <div class="text-[11px] font-mono" id="finnhub-quote-change">—</div>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px] font-mono">
        <div class="bg-brand-black/60 border border-slate-800 rounded p-2"><div class="text-slate-500">Open</div><div id="finnhub-q-o" class="text-slate-200">—</div></div>
        <div class="bg-brand-black/60 border border-slate-800 rounded p-2"><div class="text-slate-500">High</div><div id="finnhub-q-h" class="text-slate-200">—</div></div>
        <div class="bg-brand-black/60 border border-slate-800 rounded p-2"><div class="text-slate-500">Low</div><div id="finnhub-q-l" class="text-slate-200">—</div></div>
        <div class="bg-brand-black/60 border border-slate-800 rounded p-2"><div class="text-slate-500">Prev close</div><div id="finnhub-q-pc" class="text-slate-200">—</div></div>
      </div>
      <p class="text-[10px] text-slate-500" id="finnhub-quote-meta">Select a symbol to load the Finnhub quote.</p>
    </div>

    <div class="xl:col-span-4 border border-slate-800 rounded-xl bg-slate-950/50 overflow-hidden flex flex-col min-h-[360px]">
      <div class="px-3 py-2 border-b border-slate-800 flex items-center justify-between">
        <span class="text-[10px] font-mono text-slate-500 uppercase tracking-wide">Finance News</span>
        <span id="finnhub-news-scope" class="text-[9px] text-amber-400/80">Market</span>
      </div>
      <div id="finnhub-news" class="flex-1 overflow-y-auto divide-y divide-slate-800/80"></div>
    </div>
  </div>
</div>
