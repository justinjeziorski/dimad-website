<div id="view-dimad-dimdrive" class="tab-view hidden w-full h-full overflow-y-auto">
  <div class="p-6 max-w-5xl mx-auto space-y-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 class="text-lg font-black text-white flex items-center gap-2">☁️ dimDrive</h2>
        <p class="text-[12px] text-slate-400 mt-0.5">Cloud locker for dashboard files. Open WriteSpace drafts, download copies, or upload files to this device vault.</p>
      </div>
      <div class="flex items-center gap-2">
        <label class="bg-slate-950 hover:bg-slate-800 border border-slate-700 text-[11px] font-semibold text-slate-200 px-3 py-1.5 rounded-xl cursor-pointer">
          + Upload
          <input id="dimdrive-upload" type="file" class="hidden" onchange="DIMDRIVE.upload(this)">
        </label>
        <button type="button" onclick="switchTab('creator-writespace')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-[11px] px-3 py-1.5 rounded-xl">Open WriteSpace</button>
      </div>
    </div>

    <div id="dimdrive-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </div>
</div>
